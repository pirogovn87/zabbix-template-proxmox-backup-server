    - macro: '{$PBS.ROOTFS.PUSED.MAX}'
      value: '90'
      description: Root filesystem utilization threshold, %.
    - macro: '{$PBS.CERT.EXPIRY.WARN}'
      value: '14'
      description: Certificate expiry warning, days.
    - macro: '{$PBS.TASKS.INTERVAL}'
      value: 5m
      description: How often to read the task list.
    - macro: '{$PBS.TASKS.PERIOD}'
      value: '24'
      description: Period for task counters and failed task triggers, hours.
    - macro: '{$PBS.TASKS.LIMIT}'
      value: '5000'
      description: Max number of newest tasks requested from the API. Must cover all tasks within {$PBS.TASKS.PERIOD}.
    - macro: '{$PBS.DATASTORE.MATCHES}'
      value: .*
      description: Datastores to discover (regex).
    - macro: '{$PBS.DATASTORE.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Datastores to skip (regex).
    - macro: '{$PBS.DATASTORE.PUSED.WARN}'
      value: '80'
      description: 'Datastore usage warning threshold, %. Can be set per datastore with context: {$PBS.DATASTORE.PUSED.WARN:"store1"}.'
    - macro: '{$PBS.DATASTORE.PUSED.CRIT}'
      value: '90'
      description: Datastore usage critical threshold, %. Supports context.
    - macro: '{$PBS.DATASTORE.FULL.DAYS}'
      value: '30'
      description: Warn when the datastore is estimated to be full within N days. Supports context.
    - macro: '{$PBS.GROUP.INTERVAL}'
      value: 15m
      description: How often to check backup group freshness.
    - macro: '{$PBS.GROUP.MATCHES}'
      value: .*
      description: Backup groups to discover, regex on "<store>/<ns>/<type>/<id>", e.g. "store1/vm/100".
    - macro: '{$PBS.GROUP.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Backup groups to skip (regex).
    - macro: '{$PBS.GROUP.IGNORE.COMMENT}'
      value: ^nomon
      description: Groups whose PBS comment matches this regex get no freshness triggers.
    - macro: '{$PBS.GROUP.AGE.WARN}'
      value: '26'
      description: 'Warn when the newest snapshot of a group is older than N hours. Context: {$PBS.GROUP.AGE.WARN:"vm/100"}.'
    - macro: '{$PBS.GROUP.AGE.CRIT}'
      value: '50'
      description: High severity when the newest snapshot is older than N hours. Supports context.
    - macro: '{$PBS.JOBS.INTERVAL}'
      value: 5m
      description: How often to read sync/verify/prune/GC/tape job status.
    - macro: '{$PBS.JOB.MATCHES}'
      value: .*
      description: Jobs to discover (regex on job ID; for GC it is the datastore name).
    - macro: '{$PBS.JOB.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Jobs to skip (regex).
    - macro: '{$PBS.JOB.MAX.AGE}'
      value: '48'
      description: Warn when a scheduled job has not run for N hours.
    - macro: '{$PBS.JOB.MAX.AGE:"verify"}'
      value: '192'
      description: Max age for verify jobs (weekly by default), hours.
    - macro: '{$PBS.JOB.MAX.AGE:"tape"}'
      value: '192'
      description: Max age for tape backup jobs, hours.
    - macro: '{$PBS.DISK.MATCHES}'
      value: .*
      description: Disks to discover (regex).
    - macro: '{$PBS.DISK.NOT_MATCHES}'
      value: ^(zd|loop|ram|rbd)
      description: Disks to skip (regex).
    - macro: '{$PBS.DISK.WEAROUT.MAX}'
      value: '80'
      description: SSD wearout threshold, %.
    - macro: '{$PBS.ZFS.PUSED.MAX}'
      value: '80'
      description: ZFS pool utilization threshold, %.
    valuemaps:
    - uuid: d206155c3d1349fea23f7775f2c4def5
      name: PBS API state
      mappings:
      - value: '0'
        newvalue: Unavailable
      - value: '1'
        newvalue: Available
    - uuid: b2406d34cbf74524bb74945e901cf7ef
      name: PBS job state
      mappings:
      - value: '0'
        newvalue: OK
      - value: '1'
        newvalue: Warnings
      - value: '2'
        newvalue: Error
      - value: '3'
        newvalue: Running
      - value: '4'
        newvalue: Never run
    - uuid: 844a8f91cd6f4b8e9303f75605df72d2
      name: PBS SMART status
      mappings:
      - value: '0'
        newvalue: Passed
      - value: '1'
        newvalue: Failed
      - value: '2'
        newvalue: Unknown
  triggers:
  - uuid: 929448507217499dbc6eba3fb13fc314
    expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.count[backup,error])>0 and length(last(/Proxmox Backup Server by HTTP/pbs.tasks.failed[backup]))>0'
    name: 'PBS: Backup tasks failed in the last {$PBS.TASKS.PERIOD}h'
    event_name: 'PBS: Backup tasks failed in the last {$PBS.TASKS.PERIOD}h ({ITEM.LASTVALUE1}): {ITEM.LASTVALUE2}'
    opdata: 'Failed: {ITEM.LASTVALUE1}'
    priority: HIGH
    manual_close: 'YES'
    description: 'There are failed tasks of category "backup" during the last {$PBS.TASKS.PERIOD} hours. The most recent of them are shown in the problem name; the full list is in item "PBS: Failed tasks list". The problem resolves itself when the failed tasks age out of the period, or can be closed manually.'
    dependencies:
    - name: 'PBS: API is unavailable'
      expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    tags:
    - tag: component
      value: tasks
    - tag: task
      value: backup
  - uuid: f0c92f84a231444ca8e01321bde27601
    expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.count[restore,error])>0 and length(last(/Proxmox Backup Server by HTTP/pbs.tasks.failed[restore]))>0'
    name: 'PBS: Restore tasks failed in the last {$PBS.TASKS.PERIOD}h'
    event_name: 'PBS: Restore tasks failed in the last {$PBS.TASKS.PERIOD}h ({ITEM.LASTVALUE1}): {ITEM.LASTVALUE2}'
    opdata: 'Failed: {ITEM.LASTVALUE1}'
    priority: AVERAGE
    manual_close: 'YES'
    description: 'There are failed tasks of category "restore" during the last {$PBS.TASKS.PERIOD} hours. The most recent of them are shown in the problem name; the full list is in item "PBS: Failed tasks list". The problem resolves itself when the failed tasks age out of the period, or can be closed manually.'
    dependencies:
    - name: 'PBS: API is unavailable'
      expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    tags:
    - tag: component
      value: tasks
    - tag: task
      value: restore
  - uuid: 9e5e72e555804287b2b5a9ba565eadb9
    expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.count[other,error])>0 and length(last(/Proxmox Backup Server by HTTP/pbs.tasks.failed[other]))>0'
    name: 'PBS: Other tasks failed in the last {$PBS.TASKS.PERIOD}h'
    event_name: 'PBS: Other tasks failed in the last {$PBS.TASKS.PERIOD}h ({ITEM.LASTVALUE1}): {ITEM.LASTVALUE2}'
    opdata: 'Failed: {ITEM.LASTVALUE1}'
    priority: WARNING
    manual_close: 'YES'
    description: 'There are failed tasks of category "other" during the last {$PBS.TASKS.PERIOD} hours. The most recent of them are shown in the problem name; the full list is in item "PBS: Failed tasks list". The problem resolves itself when the failed tasks age out of the period, or can be closed manually.'
    dependencies:
    - name: 'PBS: API is unavailable'
      expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    tags:
    - tag: component
      value: tasks
    - tag: task
      value: other
  - uuid: 1df89434eb85454d92f777e2cd9d2080
    expression: min(/Proxmox Backup Server by HTTP/pbs.load[avg1],5m)/last(/Proxmox Backup Server by HTTP/pbs.cpu.num)>{$PBS.LOAD.PER.CPU.MAX} and last(/Proxmox Backup Server by HTTP/pbs.load[avg5])>0 and last(/Proxmox Backup Server by HTTP/pbs.load[avg15])>=0
    name: 'PBS: Load average is too high (per CPU load over {$PBS.LOAD.PER.CPU.MAX} for 5m)'
    priority: AVERAGE
    opdata: 'Load averages(1m, 5m, 15m): ({ITEM.LASTVALUE1}, {ITEM.LASTVALUE3}, {ITEM.LASTVALUE4}), # of CPUs: {ITEM.LASTVALUE2}'
    description: Per-CPU load average is too high.
    dependencies:
    - name: 'PBS: API is unavailable'
      expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
