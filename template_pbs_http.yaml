    - uuid: c33f00fa770c4881b2d31064667bc706
      name: 'PBS: Get tasks'
      type: HTTP_AGENT
      key: pbs.tasks
      delay: '{$PBS.TASKS.INTERVAL}'
      history: '0'
      value_type: TEXT
      description: |-
        Task list of the node, aggregated over the last {$PBS.TASKS.PERIOD} hours: number of OK / warning / error / running tasks per category and the list of failed tasks.
        Categories: backup (client backups pushed from PVE / proxmox-backup-client), restore, sync, verify, prune, gc, tape, other.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      - type: JAVASCRIPT
        parameters:
        - |
          var period = parseFloat('{$PBS.TASKS.PERIOD}') * 3600;
          var since = Math.floor(Date.now() / 1000) - period;
          var tasks = JSON.parse(value);
          var cats = ['all', 'backup', 'restore', 'sync', 'verify', 'prune', 'gc', 'tape', 'other'];
          var out = {}, failed = [];
          cats.forEach(function (c) { out[c] = {ok: 0, warning: 0, error: 0, running: 0}; });

          function category(type) {
              if (/tape/.test(type)) return 'tape';
              if (type === 'backup') return 'backup';
              if (type === 'reader') return 'restore';
              if (/sync/.test(type)) return 'sync';
              if (/^verif/.test(type)) return 'verify';
              if (/prune/.test(type)) return 'prune';
              if (type === 'garbage_collection') return 'gc';
              return 'other';
          }

          function pad(n) { return n < 10 ? '0' + n : '' + n; }
          function fmt(ts) {
              var d = new Date(ts * 1000);
              return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
                  + pad(d.getHours()) + ':' + pad(d.getMinutes());
          }

          tasks.forEach(function (t) {
              var running = (t.endtime === undefined || t.endtime === null);
              if (!running && t.starttime < since) return;
              var st, s = String(t.status || '');
              if (running) st = 'running';
              else if (s === 'OK') st = 'ok';
              else if (/^WARNINGS/.test(s)) st = 'warning';
              else st = 'error';
              var c = category(String(t.worker_type || ''));
              out[c][st]++;
              out.all[st]++;
              if (st === 'error') failed.push(t);
          });

          failed.sort(function (a, b) { return b.starttime - a.starttime; });
          cats.forEach(function (c) {
              var list = failed.filter(function (t) { return c === 'all' || category(String(t.worker_type || '')) === c; });
              out[c].failed = list.slice(0, 5).map(function (t) {
                  var line = t.worker_type + ' ' + (t.worker_id || '-') + ': ' + t.status;
                  return line.length > 200 ? line.substring(0, 197) + '...' : line;
              }).join('; ') + (list.length > 5 ? '; +' + (list.length - 5) + ' more' : '');
          });
          out.failed = failed.length ? failed.slice(0, 30).map(function (t) {
              return fmt(t.starttime) + ' ' + t.worker_type + ' ' + (t.worker_id || '-') + ': ' + t.status;
          }).join('\n') : 'none';
          return JSON.stringify(out);
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/tasks'
      headers: *id001
      tags:
      - tag: component
        value: raw
      query_fields:
      - name: limit
        value: '{$PBS.TASKS.LIMIT}'
    - uuid: 35fef5e96120474095f0ff562255dbf8
      name: 'PBS: All tasks OK (period)'
      type: DEPENDENT
      key: pbs.tasks.count[all,ok]
      delay: '0'
      description: Number of all tasks OK during the last {$PBS.TASKS.PERIOD} hours.
