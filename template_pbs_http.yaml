      - lld_macro: '{#DISK.SERIAL}'
        path: $.serial
    - uuid: 5cd22111914843318f7fad44742984df
      name: 'PBS: Datastore [{#STORE}]: Namespace discovery'
      type: HTTP_AGENT
      key: pbs.namespace.discovery[{#STORE}]
      delay: 1h
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers namespaces of the datastore. The root namespace is always included.
      parent_discovery_rule:
        key: pbs.datastore.discovery
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/namespace'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      lld_macro_paths:
      - lld_macro: '{#NS}'
        path: $.ns
      - lld_macro: '{#NS.LABEL}'
        path: $.label
      - lld_macro: '{#NS.QUERY}'
        path: $.query
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data || [], seen = {}, out = [];
          data.unshift({ns: ''});
          data.forEach(function (n) {
              var ns = n.ns || '';
              if (seen[ns]) return;
              seen[ns] = true;
              out.push({ns: ns, label: ns === '' ? '/' : '/' + ns + '/', query: ns === '' ? '' : '?ns=' + encodeURIComponent(ns)});
          });
          return JSON.stringify(out);
    - uuid: 8d8d0f2c0d144982a0c2ecd2ac16b9ce
      name: 'PBS: Datastore [{#STORE}{#NS.LABEL}]: Backup group discovery'
      type: HTTP_AGENT
      key: pbs.group.discovery["{#STORE}","{#NS}"]
      delay: 1h
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers backup groups (vm/<id>, ct/<id>, host/<name>) of the namespace. Filter with {$PBS.GROUP.MATCHES} / {$PBS.GROUP.NOT_MATCHES} (regex on "<store><namespace><type>/<id>", e.g. "store1/vm/100"). Groups whose comment in PBS matches {$PBS.GROUP.IGNORE.COMMENT} get no freshness triggers (useful for deleted guests whose backups are kept).
      parent_discovery_rule:
        key: pbs.namespace.discovery[{#STORE}]
      filter:
        evaltype: AND
        conditions:
        - macro: '{#GROUP}'
          value: '{$PBS.GROUP.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#GROUP}'
          value: '{$PBS.GROUP.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/groups{#NS.QUERY}'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      lld_macro_paths:
      - lld_macro: '{#BTYPE}'
        path: $['backup-type']
      - lld_macro: '{#BID}'
        path: $['backup-id']
      - lld_macro: '{#GROUP}'
        path: $.group
      - lld_macro: '{#BCOMMENT}'
        path: $.comment
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data || [];
          return JSON.stringify(data.map(function (g) {
              return {
                  'backup-type': g['backup-type'],
                  'backup-id': g['backup-id'],
                  group: '{#STORE}{#NS.LABEL}' + g['backup-type'] + '/' + g['backup-id'],
                  comment: g.comment || ''
              };
          }));
      item_prototypes:
      - uuid: cc2922f1f2084a7583aed3ac7f0df63f
        name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: Last backup age'
        type: HTTP_AGENT
        key: pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"]
        delay: '{$PBS.GROUP.INTERVAL}'
        history: 30d
        units: s
        description: Time since the newest snapshot of the group (one request to the group list of its namespace). On a sync target the snapshot time is the original backup time, so this shows end-to-end freshness.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var g = JSON.parse(value).data.filter(function (x) {
                return x['backup-type'] === '{#BTYPE}' && x['backup-id'] === '{#BID}';
            })[0];
            if (!g) throw 'Backup group {#BTYPE}/{#BID} not found';
            return Math.max(0, Math.floor(Date.now() / 1000) - g['last-backup']);
        timeout: '{$PBS.TIMEOUT}'
        url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/groups{#NS.QUERY}'
        headers:
        - name: Authorization
          value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
        tags:
        - tag: component
          value: backup
        - tag: datastore
          value: '{#STORE}'
        - tag: backup_group
          value: '{#BTYPE}/{#BID}'
        trigger_prototypes:
        - uuid: 08cd54afc2b0404696c9d6077dd79285
          expression: last(/Proxmox Backup Server by HTTP/pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"])>{$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}*3600
          name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: No backup for more than {$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}h'
          priority: HIGH
          opdata: 'Last backup: {ITEM.LASTVALUE1} ago'
          manual_close: 'YES'
          description: 'There is no new snapshot of this backup group for a long time. Check the backup job on the PVE side / client. If the guest was deleted: prune the group, exclude it with {$PBS.GROUP.NOT_MATCHES} or put "nomon" into the group comment in PBS.'
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        - uuid: acb81a8db72d495db0ae16262290b3ee
          expression: last(/Proxmox Backup Server by HTTP/pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"])>{$PBS.GROUP.AGE.WARN:"{#BTYPE}/{#BID}"}*3600
          name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: No backup for more than {$PBS.GROUP.AGE.WARN:"{#BTYPE}/{#BID}"}h'
          priority: AVERAGE
          opdata: 'Last backup: {ITEM.LASTVALUE1} ago'
          manual_close: 'YES'
          description: The last backup run of this group was probably missed or failed.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          - name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: No backup for more than {$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}h'
            expression: last(/Proxmox Backup Server by HTTP/pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"])>{$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}*3600
      overrides:
      - name: No freshness triggers for groups marked in comment
        step: '1'
        filter:
          evaltype: AND
          conditions:
          - macro: '{#BCOMMENT}'
            value: '{$PBS.GROUP.IGNORE.COMMENT}'
            operator: MATCHES_REGEX
            formulaid: A
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: LIKE
          value: No backup for
          discover: NO_DISCOVER
