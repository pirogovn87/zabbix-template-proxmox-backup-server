          value: gc
        - tag: job
          value: '{#JOB.NAME}'
        trigger_prototypes:
        - uuid: 4c4875916a9844798917a883e2ad4a58
          expression: last(/Proxmox Backup Server by HTTP/pbs.job.result[gc,"{#JOB.ID}"])<>"OK" and find(/Proxmox Backup Server by HTTP/pbs.job.result[gc,"{#JOB.ID}"],,"regexp","^(WARNINGS|running|never run)")=0
          name: 'PBS: Garbage collection [{#JOB.NAME}]: Last run failed'
          priority: AVERAGE
          opdata: '{ITEM.LASTVALUE1}'
          description: The last run of the job ended with an error. The error text is in the problem name and in the item value.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          event_name: 'PBS: Garbage collection [{#JOB.NAME}]: Last run failed: {ITEM.LASTVALUE1}'
        - uuid: 1dd73394879d46069ae5a1c6fa37ee37
          expression: find(/Proxmox Backup Server by HTTP/pbs.job.result[gc,"{#JOB.ID}"],,"regexp","^WARNINGS")=1
          name: 'PBS: Garbage collection [{#JOB.NAME}]: Last run finished with warnings'
          priority: WARNING
          description: The last run of the garbage collection finished with warnings.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          opdata: '{ITEM.LASTVALUE1}'
      master_item:
        key: pbs.jobs[gc]
      lld_macro_paths:
      - lld_macro: '{#JOB.ID}'
        path: $.id
      - lld_macro: '{#JOB.NAME}'
        path: $.name
      - lld_macro: '{#JOB.STORE}'
        path: $.store
      - lld_macro: '{#JOB.SCHEDULE}'
        path: $.schedule
      - lld_macro: '{#JOB.COMMENT}'
        path: $.comment
    tags:
    - tag: class
      value: software
    - tag: target
      value: proxmox-backup-server
    macros:
    - macro: '{$PBS.SCHEME}'
      value: https
      description: API scheme.
    - macro: '{$PBS.PORT}'
      value: '8007'
      description: API port.
    - macro: '{$PBS.NODE}'
      value: localhost
      description: Node name used in /nodes/<node>/ API paths. "localhost" always works.
    - macro: '{$PBS.TOKEN.ID}'
      value: zabbix@pbs!monitoring
      description: 'API token ID: <user>@<realm>!<token name>.'
    - macro: '{$PBS.TOKEN.SECRET}'
      value: ''
      description: API token secret (UUID).
      type: SECRET_TEXT
    - macro: '{$PBS.TIMEOUT}'
      value: 15s
      description: Timeout of HTTP requests.
    - macro: '{$PBS.LLD.LIFETIME}'
      value: 7d
      description: How long to keep resources that are no longer discovered.
    - macro: '{$PBS.CPU.UTIL.CRIT}'
      value: '90'
      description: CPU utilization threshold, %.
    - macro: '{$PBS.ROOTFS.PUSED.MAX}'
      value: '90'
      description: Root filesystem utilization threshold, %.
    - macro: '{$PBS.DISK.MATCHES}'
      value: .*
      description: Disks to discover (regex).
    - macro: '{$PBS.DISK.NOT_MATCHES}'
      value: ^(zd|loop|ram|rbd)
      description: Disks to skip (regex).
    - macro: '{$PBS.DATASTORE.MATCHES}'
      value: .*
      description: Datastores to discover (regex).
    - macro: '{$PBS.DATASTORE.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Datastores to skip (regex).
    - macro: '{$PBS.DATASTORE.PUSED.WARN}'
      value: '80'
      description: 'Datastore usage warning threshold, %. Can be set per datastore with context: {$PBS.DATASTORE.PUSED.WARN:"store1"}.'
    - macro: '{$PBS.DATASTORE.PUSED.CRIT}'
      value: '90'
      description: Datastore usage critical threshold, %. Supports context.
    - macro: '{$PBS.GROUP.INTERVAL}'
      value: 15m
      description: How often to check backup group freshness.
    - macro: '{$PBS.GROUP.MATCHES}'
      value: .*
      description: Backup groups to discover, regex on "<store>/<ns>/<type>/<id>", e.g. "store1/vm/100".
    - macro: '{$PBS.GROUP.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Backup groups to skip (regex).
    - macro: '{$PBS.GROUP.IGNORE.COMMENT}'
      value: ^nomon
      description: Groups whose PBS comment matches this regex get no freshness triggers.
    - macro: '{$PBS.GROUP.AGE.WARN}'
      value: '26'
      description: 'Warn when the newest snapshot of a group is older than N hours. Context: {$PBS.GROUP.AGE.WARN:"vm/100"}.'
    - macro: '{$PBS.GROUP.AGE.CRIT}'
      value: '50'
      description: High severity when the newest snapshot is older than N hours. Supports context.
    - macro: '{$PBS.TASKS.INTERVAL}'
      value: 5m
      description: How often to check for failed backup tasks.
    - macro: '{$PBS.TASKS.PERIOD}'
      value: '24'
      description: Failed backups are reported for this many hours (and the problem resolves after it).
    - macro: '{$PBS.TASKS.LIMIT}'
      value: '500'
      description: Max failed backup tasks requested from the API.
    - macro: '{$PBS.JOBS.INTERVAL}'
      value: 5m
      description: How often to read sync/verify/prune/GC/tape job status.
    - macro: '{$PBS.JOB.MATCHES}'
      value: .*
      description: Jobs to discover (regex on job ID; for GC it is the datastore name).
    - macro: '{$PBS.JOB.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Jobs to skip (regex).
    valuemaps:
    - uuid: d206155c3d1349fea23f7775f2c4def5
      name: PBS API state
      mappings:
      - value: '0'
        newvalue: Unavailable
      - value: '1'
        newvalue: Available
    - uuid: 844a8f91cd6f4b8e9303f75605df72d2
      name: PBS SMART status
      mappings:
      - value: '0'
        newvalue: Passed
      - value: '1'
        newvalue: Failed
      - value: '2'
        newvalue: Unknown
