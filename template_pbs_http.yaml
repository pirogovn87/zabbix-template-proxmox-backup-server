    - uuid: d4d0d501d5c043ac8eb5b43ebb9916ac
      name: 'PBS: Disk discovery'
      type: DEPENDENT
      key: pbs.disk.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DISK}'
          value: '{$PBS.DISK.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#DISK}'
          value: '{$PBS.DISK.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers physical disks.
      item_prototypes:
      - uuid: 8c93148954664a70a2a954fb36e15433
        name: 'PBS: Disk [{#DISK}]: SMART status'
        type: DEPENDENT
        key: pbs.disk.smart[{#DISK}]
        delay: '0'
        history: 30d
        description: 'SMART overall health: 0 passed, 1 failed, 2 unknown.'
        valuemap:
          name: PBS SMART status
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var d = JSON.parse(value).filter(function (x) { return x.name === '{#DISK}'; })[0];
            if (!d) throw 'Disk {#DISK} not found';
            return d.status === 'passed' ? 0 : (d.status === 'failed' ? 1 : 2);
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: disk
        - &id015
          tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: c1923cb689d84dfd89fd457db844146f
          expression: last(/Proxmox Backup Server by HTTP/pbs.disk.smart[{#DISK}])=1
          name: 'PBS: Disk [{#DISK}]: SMART health check failed'
          priority: HIGH
          description: SMART reports that the disk is failing. Replace it.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      - uuid: c0b6176b03104dcfb958abc08ad42891
        name: 'PBS: Disk [{#DISK}]: Wearout'
        type: DEPENDENT
        key: pbs.disk.wearout[{#DISK}]
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: '%'
        description: SSD wearout as shown in the PBS UI (percentage of used life). Absent for HDD.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.name == '{#DISK}')].wearout.first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: disk
        - *id015
        trigger_prototypes:
        - uuid: d727ceaf58194ad7959bed6f7429441d
          expression: last(/Proxmox Backup Server by HTTP/pbs.disk.wearout[{#DISK}])>{$PBS.DISK.WEAROUT.MAX}
          name: 'PBS: Disk [{#DISK}]: SSD wearout is high (over {$PBS.DISK.WEAROUT.MAX}%)'
          priority: WARNING
          opdata: 'Wearout: {ITEM.LASTVALUE1}'
          description: The SSD has used most of its rated write endurance. Plan the replacement.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      - uuid: 898623d98ef64e9eb7117f52a5cf9a24
        name: 'PBS: Disk [{#DISK}]: Size'
        type: DEPENDENT
        key: pbs.disk.size[{#DISK}]
        delay: '0'
        units: B
        description: Disk size.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var d = JSON.parse(value).filter(function (x) { return x.name === '{#DISK}'; })[0];
            if (!d) throw 'Disk {#DISK} not found';
            return d.size;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: disk
        - *id015
      - uuid: 821ffdbd4b4e488e81c9707ff5d24d02
        name: 'PBS: Disk [{#DISK}]: Usage'
        type: DEPENDENT
        key: pbs.disk.usage[{#DISK}]
        delay: '0'
        value_type: CHAR
        description: What the disk is used for (zfs, lvm, mounted, partitions, unused...).
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var d = JSON.parse(value).filter(function (x) { return x.name === '{#DISK}'; })[0];
            if (!d) throw 'Disk {#DISK} not found';
            return d.used || 'unused';
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: disk
        - *id015
      master_item:
        key: pbs.disks
      lld_macro_paths:
      - lld_macro: '{#DISK}'
        path: $.name
      - lld_macro: '{#DISK.MODEL}'
        path: $.model
      - lld_macro: '{#DISK.SERIAL}'
        path: $.serial
    - uuid: 7b105bf3299f437d977fef615a198b2c
      name: 'PBS: ZFS pool discovery'
      type: DEPENDENT
      key: pbs.zfs.discovery
      delay: '0'
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers ZFS pools.
      item_prototypes:
      - uuid: 9b9006ca91c3454c9eda2ddb22e943c3
        name: 'PBS: ZFS pool [{#POOL}]: Health'
        type: DEPENDENT
        key: pbs.zfs.health[{#POOL}]
        delay: '0'
        history: 30d
        value_type: CHAR
        description: Pool health (ONLINE, DEGRADED, FAULTED...).
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var p = JSON.parse(value).filter(function (x) { return x.name === '{#POOL}'; })[0];
            if (!p) throw 'Pool {#POOL} not found';
            return p.health;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.zfs
        tags:
        - tag: component
          value: zfs
        - &id016
          tag: zpool
          value: '{#POOL}'
        trigger_prototypes:
        - uuid: a393c941b16547bcab1aa17e5aed721f
          expression: last(/Proxmox Backup Server by HTTP/pbs.zfs.health[{#POOL}])<>"ONLINE"
          name: 'PBS: ZFS pool [{#POOL}] is not healthy'
          priority: HIGH
          opdata: 'State: {ITEM.LASTVALUE1}'
          description: ZFS pool state is not ONLINE. Check "zpool status".
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      - uuid: 186ebded7a3841b3b69d5787d26c0112
        name: 'PBS: ZFS pool [{#POOL}]: Size'
        type: DEPENDENT
        key: pbs.zfs.size[{#POOL}]
        delay: '0'
        units: B
        description: Pool size.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var p = JSON.parse(value).filter(function (x) { return x.name === '{#POOL}'; })[0];
            if (!p) throw 'Pool {#POOL} not found';
            return p.size;
        master_item:
          key: pbs.zfs
        tags:
        - tag: component
          value: zfs
        - *id016
      - uuid: afd1b951a2a6407ea6eeeaa1ba4294c2
        name: 'PBS: ZFS pool [{#POOL}]: Allocated'
        type: DEPENDENT
        key: pbs.zfs.alloc[{#POOL}]
        delay: '0'
        units: B
        description: Allocated space.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var p = JSON.parse(value).filter(function (x) { return x.name === '{#POOL}'; })[0];
            if (!p) throw 'Pool {#POOL} not found';
            return p.alloc;
        master_item:
          key: pbs.zfs
        tags:
        - tag: component
          value: zfs
        - *id016
      - uuid: ab067abe8c9746e59038523e014a0df7
        name: 'PBS: ZFS pool [{#POOL}]: Utilization'
        type: DEPENDENT
        key: pbs.zfs.pused[{#POOL}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: Allocated space in %. ZFS performance degrades above ~80%.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var p = JSON.parse(value).filter(function (x) { return x.name === '{#POOL}'; })[0];
            if (!p) throw 'Pool {#POOL} not found';
            return p.size > 0 ? p.alloc / p.size * 100 : 0;
        master_item:
          key: pbs.zfs
        tags:
        - tag: component
          value: zfs
        - *id016
        trigger_prototypes:
        - uuid: 86982abd1919436993b667da139e5522
          expression: last(/Proxmox Backup Server by HTTP/pbs.zfs.pused[{#POOL}])>{$PBS.ZFS.PUSED.MAX}
          name: 'PBS: ZFS pool [{#POOL}]: High utilization (over {$PBS.ZFS.PUSED.MAX}%)'
          priority: WARNING
          opdata: 'Used: {ITEM.LASTVALUE1}'
          description: ZFS pool is filling up; performance degrades on almost full pools.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      - uuid: 2eac5454d22e4b409d628066a8913551
        name: 'PBS: ZFS pool [{#POOL}]: Fragmentation'
        type: DEPENDENT
        key: pbs.zfs.frag[{#POOL}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: Pool free space fragmentation.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var p = JSON.parse(value).filter(function (x) { return x.name === '{#POOL}'; })[0];
            if (!p) throw 'Pool {#POOL} not found';
            if (p.frag === undefined) throw 'no data';
            return p.frag;
        master_item:
          key: pbs.zfs
        tags:
        - tag: component
          value: zfs
        - *id016
      master_item:
        key: pbs.zfs
      lld_macro_paths:
      - lld_macro: '{#POOL}'
        path: $.name
