    - macro: '{$PBS.TIMEOUT}'
      value: 15s
      description: Timeout of HTTP requests.
    - macro: '{$PBS.LLD.LIFETIME}'
      value: 7d
      description: How long to keep resources that are no longer discovered.
    - macro: '{$PBS.CPU.UTIL.CRIT}'
      value: '90'
      description: CPU utilization threshold, %.
    - macro: '{$PBS.CPU.IOWAIT.MAX}'
      value: '30'
      description: CPU iowait threshold, %.
    - macro: '{$PBS.LOAD.PER.CPU.MAX}'
      value: '1.5'
      description: Load average per CPU threshold.
    - macro: '{$PBS.MEMORY.PUSED.MAX}'
      value: '90'
