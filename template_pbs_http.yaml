          // Job IDs of prune / verify / sync jobs are auto-generated (default-<store>-<uuid>).
          function path(store, ns) { return (store || '') + (ns ? '/' + ns : ''); }
          function label(j) {
              var n;
              if (kind === 'sync') {
                  var local = path(j.store, j.ns);
                  var remote = (j.remote ? j.remote + ':' : '') + path(j['remote-store'], j['remote-ns']);
                  n = j['sync-direction'] === 'push' ? local + ' -> ' + remote : remote + ' -> ' + local;
              } else if (kind === 'tape') {
                  n = String(j.id) + ' (' + (j.store || '') + ' -> ' + (j.pool || '') + ')';
              } else {
                  n = path(j.store || j.id, j.ns);
              }
              if (j.comment) n += ' - ' + j.comment;
              return n;
          }

          var now = Math.floor(Date.now() / 1000);
          var jobs = (JSON.parse(value).data || []).map(function (j) {
              var state = j['last-run-state'], upid = j['last-run-upid'] || j.upid;
              return {
                  id: String(j.id || j.store),
                  name: label(j),
                  store: j.store || '',
                  remote: j.remote ? j.remote + ':' + (j['remote-store'] || '') : '',
                  schedule: j.schedule || '',
                  comment: j.comment || '',
                  state: state ? String(state) : (upid ? 'running' : 'never run'),
                  code: stateCode(state, j['last-run-endtime'], upid),
                  last: j['last-run-endtime'] || 0,
                  next: j['next-run'] || 0,
                  duration: j.duration || 0,
                  pending: j['pending-bytes'],
                  removed: j['removed-bytes']
              };
          });
          var seen = {};
          jobs.forEach(function (j) { seen[j.name] = (seen[j.name] || 0) + 1; });
          jobs.forEach(function (j) { if (seen[j.name] > 1) j.name += ' [' + j.id + ']'; });
          return JSON.stringify(jobs);
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/prune'
      headers: *id001
      tags:
      - tag: component
        value: raw
