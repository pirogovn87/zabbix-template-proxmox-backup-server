zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 3f334f60e7bf4196acaadf7d51f79821
    name: Templates/Applications
  templates:
  - uuid: 21aade7161ac49ebb23f22ffdb703f41
    template: Proxmox Backup Server by HTTP
    name: Proxmox Backup Server by HTTP
    description: |
      Proxmox Backup Server 4.x monitoring via its REST API (HTTP agent). Zabbix 7.4+ (nested LLD).
      Lightweight: only what is needed to know that backups are fine.

      Monitors:
      - API availability;
      - failed backup tasks: alert right after a backup fails, error text in the problem name;
      - CPU utilization, root filesystem usage;
      - datastores: space utilization and available space;
      - physical disks: SMART health;
      - freshness of every backup group (vm/ct/host) in every datastore and namespace:
        AVERAGE after {$PBS.GROUP.AGE.WARN}h, HIGH after {$PBS.GROUP.AGE.CRIT}h without a new snapshot;
      - sync, verify, prune and garbage collection jobs: result of the last run (error text in the problem name).

      Setup (PBS side):
        proxmox-backup-manager user create zabbix@pbs
        proxmox-backup-manager acl update / Audit --auth-id zabbix@pbs
        proxmox-backup-manager user generate-token zabbix@pbs monitoring
        proxmox-backup-manager acl update / Audit --auth-id 'zabbix@pbs!monitoring'
      Setup (Zabbix side): link the template to a host with an interface (any type) pointing to the PBS IP/DNS,
      set {$PBS.TOKEN.ID} and {$PBS.TOKEN.SECRET}. TLS certificate is not verified, self-signed certificate is OK.
    groups:
    - name: Templates/Applications
    items:
    - uuid: c39cb8609f7c46ae9c5bf3de2cddce7a
      name: 'PBS: API availability'
      type: HTTP_AGENT
      key: pbs.api.available
      delay: 1m
      history: 7d
      value_type: UNSIGNED
      description: 'Checks that the PBS API answers to an authorized request: 1 = available, 0 = not available (connection error, TLS error, wrong token, HTTP error code).'
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: JAVASCRIPT
        parameters:
        - |
          return JSON.parse(value).data.version ? 1 : 0;
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/version'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: health
      valuemap:
        name: PBS API state
      triggers:
      - uuid: 3e64d3ecd62640809603df2a587decd4
        expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        name: 'PBS: API is unavailable'
        priority: HIGH
        description: PBS API does not answer or rejects the token. Check network, the proxmox-backup-proxy service, {$PBS.TOKEN.ID} / {$PBS.TOKEN.SECRET} macros and the token permissions.
    - uuid: c22bf24b092f42019c3c957dc95b4e8b
      name: 'PBS: Get node status'
      type: HTTP_AGENT
      key: pbs.node.status
      delay: 1m
      history: '0'
      value_type: TEXT
      description: 'Raw node status: CPU, memory, swap, root filesystem, load average, uptime.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/status'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: raw
    - uuid: 8c104036fdfd48ab99850279a7441104
      name: 'PBS: CPU utilization'
      type: DEPENDENT
      key: pbs.cpu.util
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: CPU utilization in %.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cpu
      - type: MULTIPLIER
        parameters:
        - '100'
      master_item:
        key: pbs.node.status
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 6925b82d130148beb6607eb609b5423a
        expression: min(/Proxmox Backup Server by HTTP/pbs.cpu.util,5m)>{$PBS.CPU.UTIL.CRIT}
        name: 'PBS: High CPU utilization (over {$PBS.CPU.UTIL.CRIT}% for 5m)'
        priority: WARNING
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        description: CPU utilization is too high. Backup, verify and GC jobs may run slower.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: e1adac3d9c3f4747ba4247464ab97b90
      name: 'PBS: Root filesystem utilization'
      type: DEPENDENT
      key: pbs.rootfs.pused
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: Root filesystem utilization in %.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var r = JSON.parse(value).root;
          return r.total > 0 ? r.used / r.total * 100 : 0;
      master_item:
        key: pbs.node.status
      tags:
      - tag: component
        value: storage
      triggers:
      - uuid: 78139a639dce4f16a98698760730327e
        expression: last(/Proxmox Backup Server by HTTP/pbs.rootfs.pused)>{$PBS.ROOTFS.PUSED.MAX}
        name: 'PBS: Root filesystem is low on space (over {$PBS.ROOTFS.PUSED.MAX}% used)'
        priority: AVERAGE
        opdata: 'Used: {ITEM.LASTVALUE1}'
        description: Root filesystem of PBS is almost full. Logs and task archive may stop being written.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 99ea054ddd5f46fc9562661ca5385ab9
      name: 'PBS: Failed backups (period)'
      type: HTTP_AGENT
      key: pbs.backup.failed
      delay: '{$PBS.TASKS.INTERVAL}'
      history: 7d
      value_type: TEXT
      description: |-
        Backup tasks (pushed from PVE / proxmox-backup-client) that failed during the last {$PBS.TASKS.PERIOD} hours, newest first:
        "YYYY-MM-DD HH:MM <datastore>:<type>/<id>: <error>". Empty when there are none.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var since = Math.floor(Date.now() / 1000) - parseFloat('{$PBS.TASKS.PERIOD}') * 3600;
          function pad(n) { return n < 10 ? '0' + n : '' + n; }
          function fmt(ts) {
              var d = new Date(ts * 1000);
              return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
                  + pad(d.getHours()) + ':' + pad(d.getMinutes());
          }
          var failed = (JSON.parse(value).data || []).filter(function (t) {
              var s = String(t.status || '');
              return t.worker_type === 'backup' && t.endtime && t.starttime >= since
                  && s !== 'OK' && !/^WARNINGS/.test(s);
          }).sort(function (a, b) { return b.starttime - a.starttime; });
          // The first 16 characters (time of the newest failure) are used by the trigger to detect a new failure
          return failed.slice(0, 5).map(function (t) {
              var line = fmt(t.starttime) + ' ' + (t.worker_id || '-') + ': ' + t.status;
              return line.length > 300 ? line.substring(0, 297) + '...' : line;
          }).join('\n') + (failed.length > 5 ? '\n(+' + (failed.length - 5) + ' more)' : '');
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/tasks'
      query_fields:
      - name: typefilter
        value: backup
      - name: errors
        value: '1'
      - name: limit
        value: '{$PBS.TASKS.LIMIT}'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: backup
      triggers:
      - uuid: 11e6b06de7874744961a3a26110bf678
        expression: length(last(/Proxmox Backup Server by HTTP/pbs.backup.failed))>0 and left(last(/Proxmox Backup Server by HTTP/pbs.backup.failed),16)<>left(last(/Proxmox Backup Server by HTTP/pbs.backup.failed,#2),16)
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: length(last(/Proxmox Backup Server by HTTP/pbs.backup.failed))=0
        name: 'PBS: Backup failed'
        event_name: 'PBS: Backup failed: {ITEM.LASTVALUE1}'
        priority: HIGH
        type: MULTIPLE
        manual_close: 'YES'
        description: |-
          A backup task failed on PBS. A new problem is created for every new failure, the error text is in the problem name.
          The problems resolve themselves when there are no failed backups during the last {$PBS.TASKS.PERIOD} hours, or can be closed manually.
          A backup job that did not start at all is not a failed task: it is caught by the backup age triggers.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 6f13cbcf2cd741bbafcfc9a2de4ac3e8
      name: 'PBS: Get datastore usage'
      type: HTTP_AGENT
      key: pbs.datastore.usage
      delay: 5m
      history: '0'
      value_type: TEXT
      description: Raw datastore usage of all datastores.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/status/datastore-usage'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: raw
    - uuid: 649c34f12e704ed6af8d53620d399e35
      name: 'PBS: Get disks'
      type: HTTP_AGENT
      key: pbs.disks
      delay: 1h
      history: '0'
      value_type: TEXT
      description: Raw list of physical disks with SMART status (PBS runs smartctl for this request).
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/disks/list'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: raw
    - uuid: dd8bd91684564096bbc22899038c9e59
      name: 'PBS: Get sync job status'
      type: HTTP_AGENT
      key: pbs.jobs[sync]
      delay: '{$PBS.JOBS.INTERVAL}'
      history: '0'
      value_type: TEXT
      description: Raw status of all sync jobs (/admin/sync).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // 0 OK, 1 warnings, 2 error, 3 running, 4 never run
          function stateCode(state, endtime, upid) {
              if (state === undefined || state === null || state === '') {
                  return upid ? 3 : 4;
              }
              var s = String(state);
              if (s === 'OK' || s === 'ok') return 0;
              if (/^WARNINGS/i.test(s)) return 1;
              return 2;
          }

          var kind = 'sync';
          // Human-readable job name: datastore[/namespace], plus comment if set.
          // Job IDs of prune / verify / sync jobs are auto-generated (default-<store>-<uuid>).
          function path(store, ns) { return (store || '') + (ns ? '/' + ns : ''); }
          function label(j) {
              var n;
              if (kind === 'sync') {
                  var local = path(j.store, j.ns);
                  var remote = (j.remote ? j.remote + ':' : '') + path(j['remote-store'], j['remote-ns']);
                  n = j['sync-direction'] === 'push' ? local + ' -> ' + remote : remote + ' -> ' + local;
              } else if (kind === 'tape') {
                  n = String(j.id) + ' (' + (j.store || '') + ' -> ' + (j.pool || '') + ')';
              } else {
                  n = path(j.store || j.id, j.ns);
              }
              if (j.comment) n += ' - ' + j.comment;
              return n;
          }

          var now = Math.floor(Date.now() / 1000);
          var jobs = (JSON.parse(value).data || []).map(function (j) {
              var state = j['last-run-state'], upid = j['last-run-upid'] || j.upid;
              return {
                  id: String(j.id || j.store),
                  name: label(j),
                  store: j.store || '',
                  remote: j.remote ? j.remote + ':' + (j['remote-store'] || '') : '',
                  schedule: j.schedule || '',
                  comment: j.comment || '',
                  state: state ? String(state) : (upid ? 'running' : 'never run'),
                  code: stateCode(state, j['last-run-endtime'], upid),
                  last: j['last-run-endtime'] || 0,
                  next: j['next-run'] || 0,
                  duration: j.duration || 0,
                  pending: j['pending-bytes'],
                  removed: j['removed-bytes']
              };
          });
          var seen = {};
          jobs.forEach(function (j) { seen[j.name] = (seen[j.name] || 0) + 1; });
          jobs.forEach(function (j) { if (seen[j.name] > 1) j.name += ' [' + j.id + ']'; });
          return JSON.stringify(jobs);
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/sync'
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: raw
