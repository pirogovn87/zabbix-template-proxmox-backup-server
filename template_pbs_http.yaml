    discovery_rules:
    - uuid: 72cb5b81ecfb47629ce42131f31c4b4c
      name: 'PBS: Datastore discovery'
      type: DEPENDENT
      key: pbs.datastore.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#STORE}'
          value: '{$PBS.DATASTORE.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#STORE}'
          value: '{$PBS.DATASTORE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers datastores.
      item_prototypes:
      - uuid: 36b630ea272349789301b6a5500f3b1f
        name: 'PBS: Datastore [{#STORE}]: Available space'
        type: DEPENDENT
        key: pbs.datastore.avail[{#STORE}]
        delay: '0'
        units: B
        description: Available space of the datastore.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}')].avail.first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - tag: datastore
          value: '{#STORE}'
      - uuid: 8e69fda5502e4d3198efe182b80bcfed
        name: 'PBS: Datastore [{#STORE}]: Space utilization'
        type: DEPENDENT
        key: pbs.datastore.pused[{#STORE}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: Used space of the datastore in %.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}' && @.total > 0)].first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        - type: JAVASCRIPT
          parameters:
          - |
            var s = JSON.parse(value);
            return s.used / s.total * 100;
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - tag: datastore
          value: '{#STORE}'
        trigger_prototypes:
        - uuid: a7fe3f26667b42559316d9e4e57406d2
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}
          name: 'PBS: Datastore [{#STORE}]: Space is critically low (used > {$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}%)'
          priority: HIGH
          opdata: 'Used: {ITEM.LASTVALUE1}'
          description: The datastore is almost full. New backups will fail when it is full. Run prune + GC or add space.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        - uuid: ee285bb37e6b4e3d9ea6996bbae30240
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.WARN:"{#STORE}"}
          name: 'PBS: Datastore [{#STORE}]: Space is low (used > {$PBS.DATASTORE.PUSED.WARN:"{#STORE}"}%)'
          priority: WARNING
          opdata: 'Used: {ITEM.LASTVALUE1}'
          description: The datastore is filling up.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          - name: 'PBS: Datastore [{#STORE}]: Space is critically low (used > {$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}%)'
            expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}
      master_item:
        key: pbs.datastore.usage
      lld_macro_paths:
      - lld_macro: '{#STORE}'
        path: $.store
    - uuid: d4d0d501d5c043ac8eb5b43ebb9916ac
      name: 'PBS: Disk discovery'
      type: DEPENDENT
      key: pbs.disk.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DISK}'
          value: '{$PBS.DISK.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#DISK}'
          value: '{$PBS.DISK.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers physical disks.
      item_prototypes:
      - uuid: 8c93148954664a70a2a954fb36e15433
        name: 'PBS: Disk [{#DISK}]: SMART status'
        type: DEPENDENT
        key: pbs.disk.smart[{#DISK}]
        delay: '0'
        history: 30d
        description: 'SMART overall health: 0 passed, 1 failed, 2 unknown.'
        valuemap:
          name: PBS SMART status
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var d = JSON.parse(value).filter(function (x) { return x.name === '{#DISK}'; })[0];
            if (!d) throw 'Disk {#DISK} not found';
            return d.status === 'passed' ? 0 : (d.status === 'failed' ? 1 : 2);
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: disk
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: c1923cb689d84dfd89fd457db844146f
          expression: last(/Proxmox Backup Server by HTTP/pbs.disk.smart[{#DISK}])=1
          name: 'PBS: Disk [{#DISK}]: SMART health check failed'
          priority: HIGH
          description: SMART reports that the disk is failing. Replace it.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          opdata: '{#DISK.MODEL}, S/N {#DISK.SERIAL}'
      master_item:
        key: pbs.disks
      lld_macro_paths:
      - lld_macro: '{#DISK}'
