      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/disks/zfs'
      headers: *id001
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: 72cb5b81ecfb47629ce42131f31c4b4c
      name: 'PBS: Datastore discovery'
      type: DEPENDENT
      key: pbs.datastore.discovery
      delay: '0'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#STORE}'
          value: '{$PBS.DATASTORE.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#STORE}'
          value: '{$PBS.DATASTORE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers datastores.
      item_prototypes:
      - uuid: 7a9646cf1b95448fb3ada7b6a435aad9
        name: 'PBS: Datastore [{#STORE}]: Total space'
        type: DEPENDENT
        key: pbs.datastore.total[{#STORE}]
        delay: '0'
        units: B
        description: Total space of the datastore.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}')].total.first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - &id002
          tag: datastore
          value: '{#STORE}'
      - uuid: ea122046269c4ed9a15ea5b0f7442e14
        name: 'PBS: Datastore [{#STORE}]: Used space'
        type: DEPENDENT
        key: pbs.datastore.used[{#STORE}]
        delay: '0'
        units: B
        description: Used space of the datastore.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}')].used.first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - *id002
      - uuid: 36b630ea272349789301b6a5500f3b1f
        name: 'PBS: Datastore [{#STORE}]: Available space'
        type: DEPENDENT
        key: pbs.datastore.avail[{#STORE}]
        delay: '0'
        units: B
        description: Available space of the datastore.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}')].avail.first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - *id002
      - uuid: 8e69fda5502e4d3198efe182b80bcfed
        name: 'PBS: Datastore [{#STORE}]: Space utilization'
        type: DEPENDENT
        key: pbs.datastore.pused[{#STORE}]
        delay: '0'
        value_type: FLOAT
        units: '%'
        description: Used space of the datastore in %.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.store == '{#STORE}' && @.total > 0)].first()
          error_handler: DISCARD_VALUE
          error_handler_params: ''
        - type: JAVASCRIPT
          parameters:
          - |
            var s = JSON.parse(value);
            return s.used / s.total * 100;
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - *id002
        trigger_prototypes:
        - uuid: a7fe3f26667b42559316d9e4e57406d2
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}
          name: 'PBS: Datastore [{#STORE}]: Space is critically low (used > {$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}%)'
          priority: HIGH
          opdata: 'Used: {ITEM.LASTVALUE1}'
          description: The datastore is almost full. New backups will fail when it is full. Run prune + GC or add space.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        - uuid: ee285bb37e6b4e3d9ea6996bbae30240
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.WARN:"{#STORE}"}
          name: 'PBS: Datastore [{#STORE}]: Space is low (used > {$PBS.DATASTORE.PUSED.WARN:"{#STORE}"}%)'
          priority: WARNING
          opdata: 'Used: {ITEM.LASTVALUE1}'
          description: The datastore is filling up.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
          - name: 'PBS: Datastore [{#STORE}]: Space is critically low (used > {$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}%)'
            expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.pused[{#STORE}])>{$PBS.DATASTORE.PUSED.CRIT:"{#STORE}"}
      - uuid: 07ed890cd45b40aea41dc76701cb8f73
        name: 'PBS: Datastore [{#STORE}]: Estimated full date'
        type: DEPENDENT
        key: pbs.datastore.full_date[{#STORE}]
        delay: '0'
        units: unixtime
        description: Date when the datastore is estimated to be full (PBS linear forecast). 0 = not filling up / not enough history.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var s = JSON.parse(value).filter(function (d) { return d.store === '{#STORE}'; })[0];
            if (!s) throw 'Datastore {#STORE} not found';
            var e = s['estimated-full-date'];
            return (e && e > 0) ? e : 0;
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - *id002
        trigger_prototypes:
        - uuid: f73b1318b7db4e27b52e44334926d72a
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.full_date[{#STORE}])>0 and (last(/Proxmox Backup Server by HTTP/pbs.datastore.full_date[{#STORE}])-now())/86400<{$PBS.DATASTORE.FULL.DAYS:"{#STORE}"}
          name: 'PBS: Datastore [{#STORE}]: Estimated to be full in less than {$PBS.DATASTORE.FULL.DAYS:"{#STORE}"} days'
          priority: WARNING
          opdata: 'Full at: {ITEM.LASTVALUE1}'
          description: Based on usage history PBS estimates that the datastore will be full soon.
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      - uuid: e724790137004ee18af8258e1f8f5457
        name: 'PBS: Datastore [{#STORE}]: Error'
        type: DEPENDENT
        key: pbs.datastore.error[{#STORE}]
        delay: '0'
        history: 7d
        value_type: CHAR
        description: Error reported by PBS for the datastore (unavailable mount, I/O error, etc). "none" = no error.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var s = JSON.parse(value).filter(function (d) { return d.store === '{#STORE}'; })[0];
            if (!s) throw 'Datastore {#STORE} not found';
            return s.error ? String(s.error) : 'none';
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.usage
        tags:
        - tag: component
          value: datastore
        - *id002
        trigger_prototypes:
        - uuid: ec7cd0f1235e4592b3812507fc310771
          expression: last(/Proxmox Backup Server by HTTP/pbs.datastore.error[{#STORE}])<>"none"
          name: 'PBS: Datastore [{#STORE}]: Datastore reports an error'
          priority: HIGH
          opdata: '{ITEM.LASTVALUE1}'
          description: PBS reports an error for the datastore (e.g. not mounted, I/O error).
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
      master_item:
        key: pbs.datastore.usage
      lld_macro_paths:
      - lld_macro: '{#STORE}'
        path: $.store
    - uuid: 5cd22111914843318f7fad44742984df
      name: 'PBS: Datastore [{#STORE}]: Namespace discovery'
      type: HTTP_AGENT
      key: pbs.namespace.discovery[{#STORE}]
      delay: 1h
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers namespaces of the datastore. The root namespace is always included.
      parent_discovery_rule:
        key: pbs.datastore.discovery
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/namespace'
      headers: *id001
      lld_macro_paths:
      - lld_macro: '{#NS}'
        path: $.ns
      - lld_macro: '{#NS.LABEL}'
        path: $.label
      - lld_macro: '{#NS.QUERY}'
        path: $.query
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data || [], seen = {}, out = [];
          data.unshift({ns: ''});
          data.forEach(function (n) {
              var ns = n.ns || '';
              if (seen[ns]) return;
              seen[ns] = true;
              out.push({ns: ns, label: ns === '' ? '/' : '/' + ns + '/', query: ns === '' ? '' : '?ns=' + encodeURIComponent(ns)});
          });
          return JSON.stringify(out);
    - uuid: 8d8d0f2c0d144982a0c2ecd2ac16b9ce
      name: 'PBS: Datastore [{#STORE}{#NS.LABEL}]: Backup group discovery'
      type: HTTP_AGENT
      key: pbs.group.discovery["{#STORE}","{#NS}"]
      delay: 1h
      lifetime: '{$PBS.LLD.LIFETIME}'
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers backup groups (vm/<id>, ct/<id>, host/<name>) of the namespace. Filter with {$PBS.GROUP.MATCHES} / {$PBS.GROUP.NOT_MATCHES} (regex on "<store><namespace><type>/<id>", e.g. "store1/vm/100"). Groups whose comment in PBS matches {$PBS.GROUP.IGNORE.COMMENT} get no freshness triggers (useful for deleted guests whose backups are kept).
      parent_discovery_rule:
        key: pbs.namespace.discovery[{#STORE}]
      filter:
        evaltype: AND
        conditions:
        - macro: '{#GROUP}'
          value: '{$PBS.GROUP.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#GROUP}'
          value: '{$PBS.GROUP.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/groups{#NS.QUERY}'
      headers: *id001
      lld_macro_paths:
      - lld_macro: '{#BTYPE}'
        path: $['backup-type']
      - lld_macro: '{#BID}'
        path: $['backup-id']
      - lld_macro: '{#GROUP}'
        path: $.group
      - lld_macro: '{#BCOMMENT}'
        path: $.comment
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value).data || [];
          return JSON.stringify(data.map(function (g) {
              return {
                  'backup-type': g['backup-type'],
                  'backup-id': g['backup-id'],
                  group: '{#STORE}{#NS.LABEL}' + g['backup-type'] + '/' + g['backup-id'],
                  comment: g.comment || ''
              };
          }));
      item_prototypes:
      - uuid: de82305815924d9c88aa884bff8d33bf
        name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: Get group data'
        type: HTTP_AGENT
        key: pbs.group.raw["{#STORE}","{#NS}","{#BTYPE}","{#BID}"]
        delay: '{$PBS.GROUP.INTERVAL}'
        history: '0'
        value_type: TEXT
        description: Raw data of the backup group (taken from the group list of its namespace).
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var g = JSON.parse(value).data.filter(function (x) {
                return x['backup-type'] === '{#BTYPE}' && x['backup-id'] === '{#BID}';
            })[0];
            if (!g) throw 'Backup group {#BTYPE}/{#BID} not found';
            return JSON.stringify(g);
        timeout: '{$PBS.TIMEOUT}'
        url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/datastore/{#STORE}/groups{#NS.QUERY}'
        headers: *id001
        tags:
        - tag: component
          value: raw
        - &id003
          tag: datastore
          value: '{#STORE}'
        - &id004
          tag: backup_group
          value: '{#BTYPE}/{#BID}'
      - uuid: cc2922f1f2084a7583aed3ac7f0df63f
        name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: Last backup age'
        type: DEPENDENT
        key: pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"]
        delay: '0'
        history: 30d
        units: s
        description: Time since the newest snapshot of the group. On a sync target the snapshot time is the original backup time, so this shows end-to-end freshness.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            return Math.max(0, Math.floor(Date.now() / 1000) - JSON.parse(value)['last-backup']);
        master_item:
          key: pbs.group.raw["{#STORE}","{#NS}","{#BTYPE}","{#BID}"]
        tags:
        - tag: component
          value: backup
        - *id003
        - *id004
        trigger_prototypes:
        - uuid: 08cd54afc2b0404696c9d6077dd79285
          expression: last(/Proxmox Backup Server by HTTP/pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"])>{$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}*3600
          name: 'PBS: Backup [{#STORE}{#NS.LABEL}{#BTYPE}/{#BID}]: No backup for more than {$PBS.GROUP.AGE.CRIT:"{#BTYPE}/{#BID}"}h'
          priority: HIGH
          opdata: 'Last backup: {ITEM.LASTVALUE1} ago'
          manual_close: 'YES'
          description: 'There is no new snapshot of this backup group for a long time. Check the backup job on the PVE side / client. If the guest was deleted: prune the group, exclude it with {$PBS.GROUP.NOT_MATCHES} or put "nomon" into the group comment in PBS.'
          dependencies:
          - name: 'PBS: API is unavailable'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        - uuid: acb81a8db72d495db0ae16262290b3ee
          expression: last(/Proxmox Backup Server by HTTP/pbs.group.age["{#STORE}","{#NS}","{#BTYPE}","{#BID}"])>{$PBS.GROUP.AGE.WARN:"{#BTYPE}/{#BID}"}*3600
