zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 3f334f60e7bf4196acaadf7d51f79821
    name: Templates/Applications
  templates:
  - uuid: 21aade7161ac49ebb23f22ffdb703f41
    template: Proxmox Backup Server by HTTP
    name: Proxmox Backup Server by HTTP
    description: |
      Proxmox Backup Server 4.x monitoring via its REST API (HTTP agent). Zabbix 7.4+ (nested LLD).

      Monitors:
      - API availability, version, subscription, package updates, API certificate expiry;
      - CPU utilization / iowait / load, memory, swap, root filesystem, uptime;
      - datastores: size, usage, forecast of full date, errors;
      - freshness of every backup group (vm/ct/host) in every datastore and namespace;
      - tasks for the last {$PBS.TASKS.PERIOD}h: OK / warning / failed per category (backup, restore, sync, verify, prune, gc, tape) + list of failed tasks;
      - scheduled sync, verify, prune, garbage collection and tape backup jobs: last result, last/next run;
      - disks: SMART status, SSD wearout; ZFS pools: health, usage, fragmentation.

      Setup (PBS side):
        proxmox-backup-manager user create zabbix@pbs
        proxmox-backup-manager acl update / Audit --auth-id zabbix@pbs
        proxmox-backup-manager user generate-token zabbix@pbs monitoring
        proxmox-backup-manager acl update / Audit --auth-id 'zabbix@pbs!monitoring'
      Setup (Zabbix side): link the template to a host with an interface (any type) pointing to the PBS IP/DNS,
      set {$PBS.TOKEN.ID} and {$PBS.TOKEN.SECRET}. TLS certificate is not verified, self-signed certificate is OK.
    groups:
    - name: Templates/Applications
    items:
    - uuid: c39cb8609f7c46ae9c5bf3de2cddce7a
      name: 'PBS: API availability'
      type: HTTP_AGENT
      key: pbs.api.available
      delay: 1m
      history: 7d
      value_type: UNSIGNED
      description: 'Checks that the PBS API answers to an authorized request: 1 = available, 0 = not available (connection error, TLS error, wrong token, HTTP error code).'
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: JAVASCRIPT
        parameters:
        - |
          return JSON.parse(value).data.version ? 1 : 0;
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/version'
      headers: &id001
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      tags:
      - tag: component
        value: health
      valuemap:
        name: PBS API state
      triggers:
      - uuid: 3e64d3ecd62640809603df2a587decd4
        expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
        name: 'PBS: API is unavailable'
        priority: HIGH
        description: PBS API does not answer or rejects the token. Check network, the proxmox-backup-proxy service, {$PBS.TOKEN.ID} / {$PBS.TOKEN.SECRET} macros and the token permissions.
    - uuid: 59066fdbbeed438b81dd3c88c015fdef
      name: 'PBS: Version'
      type: HTTP_AGENT
      key: pbs.version
      delay: 1h
      history: 30d
      value_type: CHAR
      description: Proxmox Backup Server version.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d = JSON.parse(value).data;
          return d.version + (d.release !== undefined ? "." + d.release : "");
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/version'
      headers: *id001
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 22f470563ce54c30b129378e33e4cf24
        expression: last(/Proxmox Backup Server by HTTP/pbs.version,#1)<>last(/Proxmox Backup Server by HTTP/pbs.version,#2) and length(last(/Proxmox Backup Server by HTTP/pbs.version))>0
        name: 'PBS: Version has changed'
        priority: INFO
        manual_close: 'YES'
        description: PBS version has changed. Acknowledge to close.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: c22bf24b092f42019c3c957dc95b4e8b
      name: 'PBS: Get node status'
      type: HTTP_AGENT
      key: pbs.node.status
      delay: 1m
      history: '0'
      value_type: TEXT
      description: 'Raw node status: CPU, memory, swap, root filesystem, load average, uptime.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/status'
      headers: *id001
      tags:
      - tag: component
        value: raw
    - uuid: 8c104036fdfd48ab99850279a7441104
      name: 'PBS: CPU utilization'
      type: DEPENDENT
      key: pbs.cpu.util
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: CPU utilization in %.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cpu
      - type: MULTIPLIER
        parameters:
        - '100'
      master_item:
        key: pbs.node.status
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 6925b82d130148beb6607eb609b5423a
        expression: min(/Proxmox Backup Server by HTTP/pbs.cpu.util,5m)>{$PBS.CPU.UTIL.CRIT}
        name: 'PBS: High CPU utilization (over {$PBS.CPU.UTIL.CRIT}% for 5m)'
        priority: WARNING
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        description: CPU utilization is too high. Backup, verify and GC jobs may run slower.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 29aa1535db6544689aa0dddfb0af7703
      name: 'PBS: CPU iowait'
      type: DEPENDENT
      key: pbs.cpu.iowait
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: Share of CPU time spent waiting for I/O, in %. High values usually mean slow datastore disks.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.wait
        error_handler: DISCARD_VALUE
        error_handler_params: ''
      - type: MULTIPLIER
        parameters:
        - '100'
      master_item:
        key: pbs.node.status
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: de4171e9250d450dacd756927d1433c8
        expression: min(/Proxmox Backup Server by HTTP/pbs.cpu.iowait,10m)>{$PBS.CPU.IOWAIT.MAX}
        name: 'PBS: High CPU iowait (over {$PBS.CPU.IOWAIT.MAX}% for 10m)'
        priority: WARNING
        opdata: 'Current iowait: {ITEM.LASTVALUE1}'
        description: Disks cannot keep up with the I/O load.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 6bbf5d06c1e944e6899fbc8653addae9
