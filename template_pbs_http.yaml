    - uuid: 3dc09c294b2d4a0998febb275a44134c
      name: 'PBS: Subscription status'
      type: HTTP_AGENT
      key: pbs.subscription.status
      delay: 6h
      history: 30d
      value_type: CHAR
      description: 'Subscription status: new, notfound, active, invalid, expired, suspended.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.status
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/subscription'
      headers: *id001
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: c700fb05d72449fb9d13531fd1d366e7
        expression: find(/Proxmox Backup Server by HTTP/pbs.subscription.status,,"regexp","^(invalid|expired|suspended)$")=1
        name: 'PBS: Subscription is not valid'
        priority: INFO
        opdata: 'Status: {ITEM.LASTVALUE1}'
        description: Subscription is invalid, expired or suspended. Not a problem for no-subscription setups (status "notfound").
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 6f12b67bd58b45c3bc0d20ec1f028d64
      name: 'PBS: Available package updates'
      type: HTTP_AGENT
      key: pbs.apt.updates
      delay: 6h
      history: 30d
      value_type: UNSIGNED
      description: Number of packages with available updates (from the last apt update run by PBS).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          return JSON.parse(value).data.length;
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/apt/update'
      headers: *id001
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 6a56e9d5bce84c94ab1f3f283c66d326
        expression: last(/Proxmox Backup Server by HTTP/pbs.apt.updates)>0
        name: 'PBS: Package updates are available'
        priority: INFO
        opdata: 'Updates: {ITEM.LASTVALUE1}'
        manual_close: 'YES'
        status: DISABLED
        description: There are package updates available on PBS.
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 9809e17203e5412e868af99864b30603
      name: 'PBS: API certificate expires'
      type: HTTP_AGENT
      key: pbs.cert.expiry
      delay: 6h
      history: 30d
      value_type: UNSIGNED
      description: Expiry date of the certificate used by the PBS API/web UI (proxy.pem).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var certs = JSON.parse(value).data, min = 0;
          certs.forEach(function (c) {
              if (c.filename === 'proxy.pem' && c.notafter) min = c.notafter;
          });
          if (!min) {
              certs.forEach(function (c) { if (c.notafter && (!min || c.notafter < min)) min = c.notafter; });
          }
          if (!min) throw 'No certificates found';
          return min;
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/nodes/{$PBS.NODE}/certificates/info'
      headers: *id001
      tags:
      - tag: component
        value: system
      units: unixtime
      triggers:
      - uuid: 2fad2305ec6a476c8cabbd97a99a9054
        expression: (last(/Proxmox Backup Server by HTTP/pbs.cert.expiry)-now())/86400<{$PBS.CERT.EXPIRY.WARN}
        name: 'PBS: API certificate expires in less than {$PBS.CERT.EXPIRY.WARN} days'
        priority: WARNING
        opdata: 'Expires: {ITEM.LASTVALUE1}'
        description: Renew the PBS certificate (ACME or manual).
        dependencies:
        - name: 'PBS: API is unavailable'
          expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)=0
    - uuid: 6f13cbcf2cd741bbafcfc9a2de4ac3e8
      name: 'PBS: Get datastore usage'
      type: HTTP_AGENT
      key: pbs.datastore.usage
      delay: 5m
      history: '0'
      value_type: TEXT
      description: Raw datastore usage of all datastores.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/status/datastore-usage'
      headers: *id001
      tags:
      - tag: component
        value: raw
    - uuid: dd8bd91684564096bbc22899038c9e59
      name: 'PBS: Get sync job status'
      type: HTTP_AGENT
      key: pbs.jobs[sync]
      delay: '{$PBS.JOBS.INTERVAL}'
      history: '0'
      value_type: TEXT
      description: Raw status of all sync jobs (/admin/sync).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // 0 OK, 1 warnings, 2 error, 3 running, 4 never run
          function stateCode(state, endtime, upid) {
              if (state === undefined || state === null || state === '') {
                  return upid ? 3 : 4;
              }
              var s = String(state);
              if (s === 'OK' || s === 'ok') return 0;
              if (/^WARNINGS/i.test(s)) return 1;
              return 2;
          }

          var kind = 'sync';
          // Human-readable job name: datastore[/namespace], plus comment if set.
          // Job IDs of prune / verify / sync jobs are auto-generated (default-<store>-<uuid>).
          function path(store, ns) { return (store || '') + (ns ? '/' + ns : ''); }
          function label(j) {
              var n;
              if (kind === 'sync') {
                  var local = path(j.store, j.ns);
                  var remote = (j.remote ? j.remote + ':' : '') + path(j['remote-store'], j['remote-ns']);
                  n = j['sync-direction'] === 'push' ? local + ' -> ' + remote : remote + ' -> ' + local;
              } else if (kind === 'tape') {
                  n = String(j.id) + ' (' + (j.store || '') + ' -> ' + (j.pool || '') + ')';
              } else {
                  n = path(j.store || j.id, j.ns);
              }
              if (j.comment) n += ' - ' + j.comment;
              return n;
          }

          var now = Math.floor(Date.now() / 1000);
          var jobs = (JSON.parse(value).data || []).map(function (j) {
              var state = j['last-run-state'], upid = j['last-run-upid'] || j.upid;
              return {
                  id: String(j.id || j.store),
                  name: label(j),
                  store: j.store || '',
                  remote: j.remote ? j.remote + ':' + (j['remote-store'] || '') : '',
                  schedule: j.schedule || '',
                  comment: j.comment || '',
                  state: state ? String(state) : (upid ? 'running' : 'never run'),
                  code: stateCode(state, j['last-run-endtime'], upid),
                  last: j['last-run-endtime'] || 0,
                  next: j['next-run'] || 0,
                  duration: j.duration || 0,
                  pending: j['pending-bytes'],
                  removed: j['removed-bytes']
              };
          });
          var seen = {};
          jobs.forEach(function (j) { seen[j.name] = (seen[j.name] || 0) + 1; });
          jobs.forEach(function (j) { if (seen[j.name] > 1) j.name += ' [' + j.id + ']'; });
          return JSON.stringify(jobs);
      timeout: '{$PBS.TIMEOUT}'
      url: '{$PBS.SCHEME}://{HOST.CONN}:{$PBS.PORT}/api2/json/admin/sync'
      headers: *id001
      tags:
      - tag: component
        value: raw
